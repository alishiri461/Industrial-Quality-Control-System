[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "industrial-quality-control-system"
version = "0.1.0"
description = "On-premises industrial visual inspection API scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic-settings>=2.5,<3.0"]
[project.optional-dependencies]
vision = ["numpy>=1.26,<3.0", "opencv-python-headless>=4.10,<5.0"]
yolo = ["ultralytics>=8.3"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.pytest.ini_options]
testpaths = ["tests"]
